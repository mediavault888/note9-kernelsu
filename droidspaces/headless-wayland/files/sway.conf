# Base session config (kept minimal on purpose; per-user tweaks go in ~/.config/sway/config.d/)
set $mod Mod4
output HEADLESS-1 position 0,0 bg #1d2021 solid_color
# resolution comes from /etc/headless-wayland/config (env var; sway config can't read env directly)
exec_always sh -c 'swaymsg output HEADLESS-1 resolution "$HW_RESOLUTION"'
font pango:DejaVu Sans Mono 10
default_border pixel 2
focus_follows_mouse no

exec wayvnc -C /etc/headless-wayland/wayvnc.config -o HEADLESS-1 $HW_VNC_ADDR $HW_VNC_PORT
# second, local-only VNC feed for the browser (noVNC); only reachable inside the container
exec wayvnc -C /etc/headless-wayland/wayvnc-local.config -S /run/headless-wayland/wayvnc-web.sock -o HEADLESS-1 127.0.0.1 5901
exec sh -c '[ -n "$HW_AUTOSTART" ] && exec $HW_AUTOSTART'

bindsym $mod+Return exec foot
bindsym $mod+Shift+q kill
bindsym $mod+f fullscreen toggle
bindsym $mod+Shift+r reload
bindsym $mod+Left focus left
bindsym $mod+Right focus right
bindsym $mod+Up focus up
bindsym $mod+Down focus down
bindsym $mod+1 workspace number 1
bindsym $mod+2 workspace number 2
bindsym $mod+3 workspace number 3
bindsym $mod+Shift+1 move container to workspace number 1
bindsym $mod+Shift+2 move container to workspace number 2
bindsym $mod+Shift+3 move container to workspace number 3
bar {
    position top
    tray_output none
    status_command while date +'%Y-%m-%d %H:%M'; do sleep 30; done
}
include ~/.config/sway/config.d/*
